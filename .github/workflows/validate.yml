name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install css parser
        run: python3 -m pip install --quiet tinycss2
      - name: check public repository
        run: python3 tools/check-public.py
